name: PingviMobile
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  PingviLink:
    path: ..
settings:
  base:
    SWIFT_VERSION: 5.0
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 0.3.0
    DEVELOPMENT_TEAM: ""
targets:
  PingviMobile:
    type: application
    platform: iOS
    sources:
      - path: iOS
    dependencies:
      - package: PingviLink
      - target: PingviWatch
        embed: true
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Pingvi
        CFBundleName: Pingvi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSBonjourServices:
          - _pingvi._tcp
        NSCameraUsageDescription: Отсканируйте QR-код на Mac, чтобы безопасно подключить Pingvi.
        NSLocalNetworkUsageDescription: Pingvi получает вопросы и отправляет ответы напрямую на ваш Mac в локальной сети.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pingvi.mobile.leshchinskaya
        PRODUCT_NAME: Pingvi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: Night Aurora Orbit Classic
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: true
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: false
  PingviWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
    dependencies:
      - package: PingviLink
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Pingvi
        CFBundleName: Pingvi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.pingvi.mobile.leshchinskaya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pingvi.mobile.leshchinskaya.watch
        PRODUCT_NAME: Pingvi Watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 4
        SKIP_INSTALL: true
  PingviMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSTests
    dependencies:
      - target: PingviMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pingvi.mobile.leshchinskaya.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pingvi.app/Pingvi
        BUNDLE_LOADER: $(TEST_HOST)
  PingviMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOSUITests
    dependencies:
      - target: PingviMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pingvi.mobile.leshchinskaya.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: PingviMobile
schemes:
  PingviMobile:
    build:
      targets:
        PingviMobile: all
        PingviWatch: all
        PingviMobileTests: [test]
        PingviMobileUITests: [test]
    test:
      targets:
        - PingviMobileTests
        - PingviMobileUITests
    run:
      config: Debug
    archive:
      config: Release
